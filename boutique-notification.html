<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dc2626">
  <title>Prime Service — Détails de commande</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff7ed; color: #1f2937; }
    main { width: min(92vw, 700px); background: white; border-radius: 22px; padding: 28px; box-shadow: 0 14px 40px rgba(127, 29, 29, .16); }
    h1 { margin: 0 0 10px; color: #b91c1c; font-size: clamp(1.5rem, 5vw, 2.1rem); text-align: center; }
    h2 { margin: 0 0 8px; font-size: 1.25rem; }
    p { line-height: 1.55; }
    .alerte { background: #fef2f2; border: 2px solid #fecaca; border-radius: 16px; padding: 16px; margin: 20px 0; }
    .success { color: #166534; background: #f0fdf4; border-color: #86efac; }
    .error { color: #991b1b; }
    .details { display: grid; gap: 8px; text-align: left; }
    .ligne { padding: 10px 12px; border-radius: 10px; background: #f9fafb; }
    .carte-visuelle { position: relative; padding: 10px; border-radius: 12px; background: #eff6ff; border: 1px solid #bfdbfe; overflow: hidden; }
    .carte-grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 190px; overflow: hidden; border-radius: 9px; background: #dbeafe; }
    .carte-grille img { width: 100%; height: 100%; object-fit: cover; display: block; background: #dbeafe; }
    .carte-pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -58%); font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); pointer-events: none; }
    .carte-visuelle .secours { margin: 0; padding: 22px 12px; border-radius: 9px; background: linear-gradient(135deg, #dbeafe, #f0f9ff); color: #1e3a8a; text-align: center; font-weight: 700; }
    @media (max-width: 480px) {
      main { width: calc(100vw - 24px); box-sizing: border-box; padding: 18px 14px; border-radius: 16px; }
      .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .article { padding: 8px; }
      .article strong { font-size: .92rem; }
      .article small { font-size: .78rem; }
    }
    .photos { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 16px 0; }
    .article { border: 1px solid #e5e7eb; border-radius: 14px; padding: 10px; background: #fff; }
    .article img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; background: #f3f4f6; }
    .article strong { display: block; margin-top: 8px; }
    .article small { color: #4b5563; }
    button { width: 100%; border: 0; border-radius: 16px; padding: 20px 18px; color: white; background: #dc2626; font-size: 1.2rem; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #991b1b; }
    button:active { transform: translateY(4px); box-shadow: 0 4px 0 #991b1b; }
    button:disabled { opacity: .65; cursor: not-allowed; }
    .compteur { text-align: center; font-weight: 800; color: #b91c1c; }
    a { color: #2563eb; font-weight: 700; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <main>
    <h1>🔔 Prime Service</h1>
    <p id="intro">Lecture obligatoire des détails de la commande avant confirmation.</p>
    <div id="message" class="alerte">Chargement sécurisé de la commande…</div>
    <section id="details" class="details" hidden></section>
    <div id="photos" class="photos" hidden></div>
    <p id="compteur" class="compteur" hidden></p>
    <button id="btnAccuser" type="button" disabled>🔒 Lecture en cours…</button>
    <p><small>Le bouton sera activé après 1 min 30 s de lecture. Après confirmation, les relances automatiques s’arrêtent.</small></p>
    <p><a href="./">Retourner sur Prime Service</a></p>
  </main>
  <script>
    const SUPABASE_URL = "https://kfxalpvbtbvkncztjwzc.supabase.co";
    const ENDPOINT = `${SUPABASE_URL}/functions/v1/accuser-notification`;
    const params = new URLSearchParams(location.search);
    const token = params.get("token") || "";
    const status = params.get("status") || "";
    const box = document.getElementById("message");
    const detailsBox = document.getElementById("details");
    const photosBox = document.getElementById("photos");
    const counter = document.getElementById("compteur");
    const button = document.getElementById("btnAccuser");
    let canAcknowledge = false;
    let acknowledged = false;
    let expiresAtMs = 0;
    let countdownTimer = null;

    function setError(text) {
      box.className = "alerte error";
      box.textContent = text;
      button.disabled = true;
      if (countdownTimer) clearInterval(countdownTimer);
    }

    function addLine(label, value) {
      const line = document.createElement("div");
      line.className = "ligne";
      const strong = document.createElement("strong");
      strong.textContent = `${label} `;
      line.append(strong, document.createTextNode(value || "—"));
      detailsBox.appendChild(line);
    }

    function addGoogleMapsLink(label, latitude, longitude) {
      const lat = Number(latitude);
      const lng = Number(longitude);
      if(!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) return;

      const line = document.createElement("div");
      line.className = "ligne";
      const strong = document.createElement("strong");
      strong.textContent = `${label} `;
      const link = document.createElement("a");
      link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${lat},${lng}`)}`;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Ouvrir la carte Google Maps";
      link.title = "Connexion Internet requise pour ouvrir Google Maps";
      link.style.cssText = "color:#2563eb;font-weight:700;text-decoration:underline;";
      link.addEventListener("click", (event) => {
        if(!navigator.onLine){
          event.preventDefault();
          box.textContent = "⚠️ Une connexion Internet est nécessaire pour ouvrir Google Maps.";
          box.className = "alerte error";
        }
      });
      line.append(strong, link);
      detailsBox.appendChild(line);

      const preview = document.createElement("div");
      preview.className = "carte-visuelle";
      preview.style.marginTop = "-2px";
      const zoom = 16;
      const totalTiles = 2 ** zoom;
      const radians = lat * Math.PI / 180;
      const centreX = Math.floor(((lng + 180) / 360) * totalTiles);
      const centreY = Math.floor(((1 - Math.asinh(Math.tan(radians)) / Math.PI) / 2) * totalTiles);
      const grille = document.createElement("div");
      grille.className = "carte-grille";
      const pin = document.createElement("span");
      pin.className = "carte-pin";
      pin.textContent = "📍";
      pin.setAttribute("aria-hidden", "true");
      const fallback = document.createElement("p");
      fallback.className = "secours";
      fallback.hidden = true;
      fallback.textContent = "📍 Aperçu visuel indisponible hors connexion. Le lien Google Maps ci-dessus nécessite Internet.";
      let tuilesEchouees = 0;
      const totalTuiles = 6;
      for(let ligne = -1; ligne <= 0; ligne++){
        for(let colonne = -1; colonne <= 1; colonne++){
          const tuile = document.createElement("img");
          const tuileX = (centreX + colonne + totalTiles) % totalTiles;
          const tuileY = Math.max(0, Math.min(totalTiles - 1, centreY + ligne));
          tuile.src = `https://tile.openstreetmap.org/${zoom}/${tuileX}/${tuileY}.png`;
          tuile.alt = "";
          tuile.loading = "lazy";
          tuile.referrerPolicy = "no-referrer";
          tuile.addEventListener("error", () => {
            tuilesEchouees++;
            tuile.hidden = true;
            if(tuilesEchouees === totalTuiles){
              grille.hidden = true;
              pin.hidden = true;
              fallback.hidden = false;
            }
          });
          grille.appendChild(tuile);
        }
      }
      preview.append(grille, pin, fallback);
      detailsBox.appendChild(preview);
    }

    function renderDetails(command) {
      detailsBox.replaceChildren();
      photosBox.replaceChildren();
      addLine("Boutique :", command.boutique);
      addLine("Adresse boutique :", command.adresse_boutique);
      addLine("Client :", command.nom_client);
      addLine("Téléphone client :", command.telephone_client);
      addLine("Quartier de livraison :", command.quartier_client);
      addGoogleMapsLink("Carte de livraison :", command.lat_client, command.lng_client);
      addLine("Précision de livraison :", command.precision_livraison);
      addLine("Montant NET à recevoir :", `${Number(command.montant_net_total || 0).toLocaleString("fr-FR")} FCFA`);

      const articles = Array.isArray(command.articles) ? command.articles : [];
      articles.forEach((article) => {
        const card = document.createElement("article");
        card.className = "article";
        if (article.image_url) {
          const image = document.createElement("img");
          image.src = article.image_url;
          image.alt = article.nom || "Photo de l’article";
          image.loading = "lazy";
          card.appendChild(image);
        }
        const title = document.createElement("strong");
        title.textContent = `${article.nom || "Article"} x${article.quantite || 1}`;
        const net = document.createElement("small");
        net.textContent = `Montant net : ${Number(article.montant_net || 0).toLocaleString("fr-FR")} FCFA`;
        card.append(title, net);
        photosBox.appendChild(card);
      });
      detailsBox.hidden = false;
      photosBox.hidden = articles.length === 0;
    }

    function showAcknowledged() {
      acknowledged = true;
      box.className = "alerte success";
      box.textContent = "✅ Merci. La commande est marquée comme vue et les relances sont arrêtées.";
      button.disabled = true;
      button.textContent = "✅ COMMANDE VUE";
      counter.hidden = true;
      if (countdownTimer) clearInterval(countdownTimer);
    }

    function expirePage() {
      if (acknowledged) return;
      setError("Cette notification a expiré après une heure. Ouvrez le dernier message reçu si une nouvelle commande vous concerne.");
      detailsBox.hidden = true;
      photosBox.hidden = true;
      counter.hidden = true;
    }

    function startCountdown(remainingSeconds) {
      let remaining = Math.max(0, Number(remainingSeconds) || 0);
      counter.hidden = false;
      const tick = () => {
        if (expiresAtMs && Date.now() >= expiresAtMs) return expirePage();
        if (remaining <= 0) {
          canAcknowledge = true;
          button.disabled = false;
          button.textContent = "🟥 J’AI VU LA COMMANDE";
          counter.textContent = "✅ 1 min 30 s de lecture est terminée. Vous pouvez confirmer.";
          if (countdownTimer) clearInterval(countdownTimer);
          return;
        }
        counter.textContent = `⏳ Lisez les détails encore ${remaining} seconde${remaining > 1 ? "s" : ""} avant de confirmer.`;
        remaining -= 1;
      };
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    async function callAction(action) {
      const response = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, action }),
      });
      let body = {};
      try { body = await response.json(); } catch { /* réponse vide */ }
      if (!response.ok) {
        const error = new Error(body.error || "Opération impossible");
        error.code = body.code || (response.status === 410 ? "expired" : "");
        throw error;
      }
      return body;
    }

    async function loadPage() {
      if (status === "ack") return showAcknowledged();
      if (!token) return setError("Ce lien ne contient pas de jeton valide. Ouvrez le dernier message reçu.");
      try {
        const body = await callAction("details");
        expiresAtMs = Date.parse(body.expiresAt || "") || 0;
        if (expiresAtMs && Date.now() >= expiresAtMs) return expirePage();
        if (!body.command) return setError("Les détails de cette commande sont indisponibles.");
        renderDetails(body.command);
        expiresAtMs = Date.parse(body.expiresAt || "") || expiresAtMs;
        if (body.status === "accusee") return showAcknowledged();
        box.className = "alerte";
        box.textContent = "📖 Lisez attentivement la boutique, l’adresse, les articles, les photos et le montant net.";
        startCountdown(body.remainingSeconds);
      } catch (error) {
        if (error.code === "expired") return expirePage();
        setError(error.message || "Impossible de charger les détails de la commande.");
      }
    }

    button.addEventListener("click", async () => {
      if (!token || !canAcknowledge || acknowledged) return;
      button.disabled = true;
      button.textContent = "Enregistrement…";
      try {
        await callAction("ack");
        history.replaceState({}, "", `${location.pathname}?status=ack`);
        showAcknowledged();
      } catch (error) {
        if (error.code === "expired") return expirePage();
        button.disabled = false;
        button.textContent = "🟥 RÉESSAYER — J’AI VU LA COMMANDE";
        box.className = "alerte error";
        box.textContent = error.message || "La confirmation n’a pas pu être enregistrée.";
      }
    });

    loadPage();
  </script>
</body>
</html>
