name: Déploiement des fonctions Supabase

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-functions.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Publier les Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Version figée : la CLI 3.x a renommé --project-ref en --remote et
          # impose --yes en CI, ce qui cassait le déploiement quand « latest »
          # passait de 2.x à 3.x. Une montée de version devient un choix explicite.
          version: 3.1.0

      - name: Vérifier les secrets de déploiement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Secret SUPABASE_PROJECT_REF manquant"; exit 1; }

      - name: Déployer envoyer-commande
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-commande --remote="$SUPABASE_PROJECT_REF" --yes --no-verify-jwt

      - name: Déployer acces-boutiquier
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy acces-boutiquier --remote="$SUPABASE_PROJECT_REF" --yes --no-verify-jwt

      - name: Déployer envoyer-sms-orange
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-sms-orange --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer notifier-commande-manuellement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notifier-commande-manuellement --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer clever-processor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy clever-processor --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer envoyer-inscription
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-inscription --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer notifier-boutiquier
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notifier-boutiquier --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer accuser-notification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy accuser-notification --remote="$SUPABASE_PROJECT_REF" --yes --no-verify-jwt

      - name: Déployer lier-notification-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy lier-notification-push --remote="$SUPABASE_PROJECT_REF" --yes --no-verify-jwt

      - name: Déployer enregistrer-visite
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy enregistrer-visite --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer embellir-photo-produit
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy embellir-photo-produit --remote="$SUPABASE_PROJECT_REF" --yes

      - name: Déployer avertir-commission-samedi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy avertir-commission-samedi --remote="$SUPABASE_PROJECT_REF" --yes
