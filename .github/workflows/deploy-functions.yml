name: Déploiement des fonctions Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publier les Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Vérifier les secrets de déploiement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Secret SUPABASE_ACCESS_TOKEN manquant"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Secret SUPABASE_PROJECT_REF manquant"; exit 1; }

      - name: Déployer envoyer-commande
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-commande --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Déployer envoyer-sms-orange
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-sms-orange --project-ref "$SUPABASE_PROJECT_REF"

      - name: Déployer notifier-commande-manuellement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notifier-commande-manuellement --project-ref "$SUPABASE_PROJECT_REF"

      - name: Déployer clever-processor
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy clever-processor --project-ref "$SUPABASE_PROJECT_REF"

      - name: Déployer envoyer-inscription
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy envoyer-inscription --project-ref "$SUPABASE_PROJECT_REF"

      - name: Déployer notifier-boutiquier
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notifier-boutiquier --project-ref "$SUPABASE_PROJECT_REF"

      - name: Déployer accuser-notification
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy accuser-notification --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Déployer lier-notification-push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy lier-notification-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Déployer enregistrer-visite
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy enregistrer-visite --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
